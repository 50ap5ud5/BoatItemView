plugins {
    id "com.github.johnrengelman.shadow" version "8.1.1"
    id "me.shedaniel.unified-publishing" version "0.1.+"
}

architectury {
    platformSetupLoomIde()
    fabric()
}

unifiedPublishing {
    project {
        displayName = "[Fabric] - Boat Item View - v$project.version"
        releaseType = "release"
        changelog = new File("${rootProject.projectDir}/changelog.md").text
        gameVersions = ["$rootProject.minecraft_version"]
        mainPublication tasks.remapJar
        gameLoaders = ["fabric"]
        relations {
            optional {
                curseforge = "modmenu"
                modrinth = "modmenu"
            }
        }

        var CURSE_API_KEY = project.findProperty("curseforge_publish") ?: System.getenv("curseforge_publish") ?: ""
        if (CURSE_API_KEY != "") {
            curseforge {
                token = CURSE_API_KEY
                id = "482160"
                gameVersions.addAll "Java 21", "$rootProject.minecraft_version"
            }
        }

        var MODRINTH_TOKEN = project.findProperty("modrinth_publish") ?: System.getenv("modrinth_publish") ?: ""
        if (MODRINTH_TOKEN != "") {
            modrinth {
                token = MODRINTH_TOKEN
                id = "BdKIyOLe"
                version = "$project.version+$project.name"
            }
        }
    }
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath
}

configurations {
    common
    shadowCommon // Don't use shadow from the shadow plugin because we don't want IDEA to index this.
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
}

repositories {

    // the repository for Cloth Config
    maven { url "https://maven.shedaniel.me/" }

    maven {
        url "https://cursemaven.com"
    }

    maven {
        name = "Mod Menu Maven"
        url = "https://maven.terraformersmc.com/"
    }

    maven {
        name = "Fuzs Mod Resources"
        url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/"
    }
}

dependencies {

    // Fabric API. This is technically optional, but we need this for Forge Config API Port
    modImplementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"


    // Forge Config API Port
//    modApi "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${rootProject.forge_config_api_port_version}"
//    include "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${rootProject.forge_config_api_port_version}"

    modApi("me.shedaniel.cloth:cloth-config-fabric:${rootProject.cloth_config_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }

    include "me.shedaniel.cloth:cloth-config-fabric:${rootProject.cloth_config_version}"

    modCompileOnly("com.terraformersmc:modmenu:${rootProject.mod_menu_version}") {
        transitive(false)
    }
    modRuntimeOnly("com.terraformersmc:modmenu:${rootProject.mod_menu_version}")


    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionFabric")) { transitive false }
}

/* IntelliJ Project Import
 * The Mixin annotation process does not have an obfuscation source when running through the IntelliJ compiler,
 * Thus we have to prevent it from being activated as part of importing this Gradle project into IntelliJ.
 */
if (System.getProperty("idea.sync.active") == "true") {
    afterEvaluate {
        tasks.withType(JavaCompile).all {
            it.options.annotationProcessorPath = files()
        }
    }
}


def resourceTargets = ["fabric.mod.json", "boatiview.mixins.json"]
def intoTargets = ["$rootDir/out/production/resources/", "$rootDir/out/production/${project.name}.main/", "$rootDir/bin/main/"]
def replaceProperties = [mod_id: mod_id,
                         mod_name: mod_name,
                         mod_version: mod_version,
                         mod_authors: mod_authors,
                         credits: credits,
                         mod_description: mod_description,
                         logo_file: logo_file,
                         issue_tracker_url: issue_tracker_url,
                         // update_json_url: update_json_url,
                         homepage: homepage,
                         sources: sources,
                         license: license,
                         main_mod_class: main_mod_class,
                         fabric_api_version_range: fabric_api_version_range,
                         fabric_minecraft_version_range: fabric_minecraft_version_range,
                         fabric_loader_version_range: fabric_loader_version_range,
                         fabric_java_version_range: fabric_java_version_range
]
processResources {
    inputs.properties replaceProperties
    replaceProperties.put 'project', project

    filesMatching(resourceTargets) {
        expand replaceProperties
    }

    intoTargets.each { target ->
        if (file(target).exists()) {
            copy {
                from(sourceSets.main.resources) {
                    include resourceTargets
                    expand replaceProperties
                }
                into target
            }
        }
    }
}

shadowJar {
    exclude "architectury.common.json"
    configurations = [project.configurations.shadowCommon]
    archiveClassifier = "dev-shadow"
}

remapJar {
    injectAccessWidener = true
    inputFile.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier.set(null)
}

jar {
    archiveClassifier.set("dev")
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

publishing {
    publications {
        mavenForge(MavenPublication) {
            artifactId = archives_base_name + "_" + project.name
            from components.java
        }
    }
}
