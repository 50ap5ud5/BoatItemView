plugins {
    id 'multiloader-loader'
    id 'net.minecraftforge.accesstransformers' // AccessTransformers needs to be applied before FG if you want to use the minecraft block config options
    id 'net.minecraftforge.gradle'
}

//Use the existing Neoforge data generator for resource pack data
def generatedResources = project(":neoforge").file("src/generated/resources")

sourceSets {
    main {
        resources.srcDir generatedResources
    }
}

repositories {
    maven minecraft.mavenizer
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
}

minecraft {

    mappings channel: 'official', version: minecraft_version

    /*
    * This is a magic helper flag, it will enable access transformers on any
    * minecraft dependencies and look in all sourcesets for a file with
    * the path: [forge project]/src/main/resources/META-INF/accesstransformer.cfg
    * It also enables some error messages when the file can not be found, to help users
    * who are using the most default case.
    */
    accessTransformers = true


    runs {
        // Applies to all the run configs below.
        // Run configs are now generated by Forge's SlimeLauncher for most IDEs including Intellij, with the exception of Eclipse IDE
        configureEach {
            systemProperty 'forge.logging.console.level', 'debug'
            systemProperty 'eventbus.api.strictRuntimeChecks', 'true'
            args "-mixin.config=${mod_id}.common.mixins.json" // Mixin requires either specifying the config via command line, or in the Manifest
        }

        register('client') {
            workingDir = file('runs/client')
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
        }

        register('server') {
            workingDir = file('runs/server')
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        register('data') {
            workingDir = file('runs/data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }

}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir layout.projectDirectory.dir('src/generated/resources') }

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")

    // This is currently bugged due to the absence of obfuscation mappings
    //annotationProcessor "org.spongepowered:mixin:0.8.5-SNAPSHOT:processor"

    annotationProcessor 'net.minecraftforge:eventbus-validator:7.0-beta.12'

//    implementation("me.shedaniel.cloth:cloth-config-forge:${rootProject.cloth_config_version}")

//    //Use Neoforge Config specific for Forge as specified by https://github.com/Fuzss/forgeconfigapiport/wiki/Getting-Started-on-1.20.2-and-Up#selecting-a-version
//    api ("fuzs.forgeconfigapiport:forgeconfigapiport-forge:${rootProject.forge_config_api_port_version}")
//    implementation(jarJar("fuzs.forgeconfigapiport:forgeconfigapiport-forge:${rootProject.forge_config_api_port_version}")){
//        jarJar.ranged(it, "[${rootProject.forge_config_api_port_version},)")
//    }

}

tasks.named('jar', Jar) {
    manifest {
        // Add our config to the manifest of our jar to have Mixin detect us at runtime.
        attributes['MixinConfigs'] = "${mod_id}.common.mixins.json"
    }
}


sourceSets.each {
    def dir = layout.buildDirectory.dir("sourcesSets/$it.name")
    it.output.resourcesDir = dir
    it.java.destinationDirectory = dir
}

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements'].each { variant ->
    configurations.named("$variant") {
        attributes {
            attribute(loaderAttribute, 'forge')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant->
        configurations.named("$variant") {
            attributes {
                attribute(loaderAttribute, 'forge')
            }
        }
    }
}