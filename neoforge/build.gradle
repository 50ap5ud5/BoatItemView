plugins {
    id "com.github.johnrengelman.shadow" version "8.1.1"
    id "me.shedaniel.unified-publishing" version "0.1.+"
}
architectury {
    platformSetupLoomIde()
    neoForge();
}
//Use the existing fabric data generator for resource pack data
def generatedResources = project(":neoforge").file("src/generated/resources")

sourceSets {
    main {
        resources.srcDir generatedResources
    }
}

unifiedPublishing {
    project {
        displayName = "[Neoforge] - ${rootProject.mod_name} - v$project.version"
        releaseType = "release"
        changelog = new File("${rootProject.projectDir}/changelog.md").text
        gameVersions = ["$rootProject.minecraft_version"]
        mainPublication tasks.remapJar
        gameLoaders = ["neoforge"]
        relations {
            optional {
                curseforge = "configured"
            }
        }

        var CURSE_API_KEY = project.findProperty("curseforge_publish") ?: System.getenv("curseforge_publish") ?: ""
        if (CURSE_API_KEY != "") {
            curseforge {
                token = CURSE_API_KEY
                id = "482444"
                gameVersions.addAll "Java 21", "$rootProject.minecraft_version"
            }
        }

        var MODRINTH_TOKEN = project.findProperty("modrinth_publish") ?: System.getenv("modrinth_publish") ?: ""
        if (MODRINTH_TOKEN != "") {
            modrinth {
                token = MODRINTH_TOKEN
                id = "BdKIyOLe"
                version = "$project.version+$project.name"
            }
        }
    }
}



loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath

    //Use Neoforge data generators for datapack related data
    runs {
        data {
            data()
            programArgs "--all", "--mod", "${mod_id}"
            programArgs "--output", project(":neoforge").file("src/generated/resources").absolutePath
            programArgs "--existing", project(":common").file("src/main/resources/").absolutePath
        }
    }

}


configurations {
    common
    shadowCommon // Don't use shadow from the shadow plugin because we don't want IDEA to index this.
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common
}

repositories {
    maven { url "https://maven.neoforged.net/releases/" }
}

dependencies {
    neoForge "net.neoforged:neoforge:${neoforge_version}"

    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionNeoForge")) { transitive false }

    //Required for compiling as we use Cloth config for Fabric but reuse the same object for Neoforge native Config
    //We don't want to include Cloth config for the Neoforge version
//    modApi("me.shedaniel.cloth:cloth-config-neoforge:${rootProject.cloth_config_version}")

//    modCompileOnly "curse.maven:configured-457570:${rootProject.configured_version}"
//    modRuntimeOnly "curse.maven:configured-457570:${rootProject.configured_version}"
//    include "me.shedaniel.cloth:cloth-config-neoforge:${rootProject.cloth_config_version}"

}

def resourceTargets = ["META-INF/neoforge.mods.toml", "pack.mcmeta"]
def intoTargets = ["$rootDir/out/production/resources/", "$rootDir/out/production/${project.name}.main/", "$rootDir/bin/main/"]
def replaceProperties = [mod_id: mod_id,
                         mod_name: mod_name,
                         mod_version: mod_version,
                         mod_authors: mod_authors,
                         credits:credits,
                         mod_description: mod_description,
                         homepage:homepage,
                         logo_file:logo_file,
                         issue_tracker_url:issue_tracker_url,
                         license: license,
                         neoforge_version_range: neoforge_version_range,
                         neoforge_minecraft_version_range: neoforge_minecraft_version_range,
                         neoforge_loader_version_range: neoforge_loader_version_range,
                         neoforge_resource_pack_format: neoforge_resource_pack_format
//                         neoforge_java_version_range: neoforge_java_version_range

]
processResources {
    inputs.properties replaceProperties
    replaceProperties.put 'project', project

    filesMatching(resourceTargets) {
        expand replaceProperties
    }

    intoTargets.each { target ->
        if (file(target).exists()) {
            copy {
                from(sourceSets.main.resources) {
                    include resourceTargets
                    expand replaceProperties
                }
                into target
            }
        }
    }
}

shadowJar {
    exclude "fabric.mod.json"
    exclude "architectury.common.json"

    configurations = [project.configurations.shadowCommon]
    archiveClassifier = "dev-shadow"
}

remapJar {
    inputFile.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier.set(null)
    atAccessWideners.add("${rootProject.mod_id}.accesswidener")
}

jar {
    archiveClassifier.set("dev")
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

tasks.withType(JavaCompile) {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly // see [http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html](http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html)
    // If Javadoc is generated, this must be specified in that task too.
    options.encoding = "UTF-8"
    options.release = 21
}
publishing {
    publications {
        mavenForge(MavenPublication) {
            artifactId = archives_base_name + "_" + project.name
            from components.java
        }
    }

}