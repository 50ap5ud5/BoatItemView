# Gradle
# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=false

#Project
java_version=21

# Mod Properties
jar_name=Boat-Item-View
mod_id=boatiview
mod_version=0.0.6
maven_group=me.soapsuds
minecraft_version=1.21.1
